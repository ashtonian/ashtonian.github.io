name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check --strict
          mkdir -p hugo-bin
          tar -xzf "$tarball" -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --cleanDestinationDir

      - name: Check internal links
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r href; do
            path="public${href%%#*}"
            [ -e "$path" ] || [ -e "${path%/}/index.html" ] || { echo "broken: $href"; missing=1; }
          done < <(grep -rhoE 'href="?/[^"> ]*' public --include='*.html' | sed -E 's/^href="?//' | sort -u)
          exit "$missing"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
