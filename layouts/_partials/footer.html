<footer class="wrap site-footer">
  <p class="contact">
    {{- /* email_off stops Cloudflare's Email Obfuscation from swapping the address
           for "[email protected]" plus a decoding script. */}}
    {{ "<!--email_off-->" | safeHTML }}<a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>{{ "<!--/email_off-->" | safeHTML }}
    <a href="{{ site.Params.github }}">GitHub</a>
    <a href="{{ site.Params.linkedin }}">LinkedIn</a>
  </p>
  <p>Figures as of {{ time.Format "January 2006" site.Params.figuresAsOf }}.</p>
</footer>
